name: aplikasi_gudang
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  #UI Stuff
  font_awesome_flutter: ^10.7.0 #font awesome icons
  cupertino_icons: ^1.0.6 #google icons
  cached_network_image: ^3.3.1 #showing network image with cache. so user no need to reload image
  flutter_spinkit: ^5.2.1 #to add loading animation
  money_formatter: ^0.0.6 #formatting text to money
  bottom_navy_bar: ^6.0.0 #custom navigator bar
  intl: ^0.19.0 #internationalization and localization facilities, time date etc.
  month_picker_dialog: ^5.1.0
  timezone: ^0.9.4 #waktu Indonesia
  flutter_svg: ^2.0.10+1 #to Use SVG in app
  carousel_slider: ^4.2.1 #carousel Slider image
  image_watermark: ^0.1.0 #add watermark to image

  #Local Data
  shared_preferences: ^2.2.3 #save data to local preferences e.g. user logged in or not
  path_provider: ^2.1.3 #provide temp path
  package_info_plus: ^8.0.0 #get app version

  #API Stuff
  http: ^1.2.1 #shot API

  #state management
  provider: ^6.1.2

  #Snackbar
  awesome_snackbar_content: ^0.1.3 #create custom snackbar
  another_flushbar: ^1.12.30
  quickalert: ^1.1.0

  #Scanner
  simple_barcode_scanner: ^0.2.5
  
  #Permission
  permission_handler: ^11.3.1

  #Firebase Stuff
  cloud_firestore: ^5.3.0
  cloud_functions: ^5.1.3
  
  # Animation menu
  rive: ^0.13.20

  #TimeLine
  timeline_tile: ^2.0.0

  #Rutinitas
  googleapis: ^13.1.0

  #Font
  google_fonts: ^6.2.1

  # Responsive
  flutter_screenutil: ^5.9.3

  # penanda tutorial
  tutorial_coach_mark: ^1.2.11

  # barcode
  flutter_secure_storage: ^9.2.2

  # chart
  fl_chart: ^0.69.0

  another_flutter_splash_screen: ^1.2.1


  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  #CLI
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1 
  change_app_package_name: ^1.1.0

flutter_native_splash:
  background_image: assets/images/utama.png
  image: assets/images/fagettimiring2.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/Riveasset/

